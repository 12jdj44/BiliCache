plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bilicache'
    compileSdk 34

    defaultConfig {
        applicationId "com.bilicache"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 只用于编译，不打进 APK（LSPosed 运行时会提供）
    compileOnly 'de.robv.android.xposed:api:82'
}
